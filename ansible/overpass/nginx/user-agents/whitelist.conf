# Custom User-Agent whitelist.
#
# Every *.conf file in this directory is included (in alphabetical order)
# inside the nginx `map $http_user_agent $client_class` block of
# nginx.conf.template, before the built-in browser detection.
#
# This directory is baked into the image as the default and bind-mounted
# read-only by compose.yml, so it can be edited while the container runs.
# Changes take effect after reloading nginx (a bad file is rejected by
# `nginx -t` and the running config stays untouched):
#
#   docker compose exec api sh -c 'nginx -t && nginx -s reload'
#
# Each entry is `<pattern> <class>;` where:
#
#   <pattern>  an exact string ("MyApp/1.0") or a regex:
#              "~..."  case-sensitive, "~*..." case-insensitive
#   <class>    allowed  -> request passes, no Referer required
#              browser  -> treated like a browser, Referer required
#              deny     -> always rejected (useful to block an agent that
#                          would otherwise be detected as a browser)
#
# Exact strings are always checked first; regexes are checked in the order
# they appear (this file first, then the built-in browser list), first match
# wins.
#
# Performance: every regex here runs on each request not matched before it,
# including ALL browser traffic, so keep the list short and the patterns cheap:
#   - prefer exact strings (hash lookup, near zero cost) when the UA is fixed;
#   - anchor regexes with ^ so non-matching UAs fail on the first characters;
#   - prefer case-sensitive "~" over "~*";
#   - merge related agents into one regex: "~^(?:JOSM|iD|Vespucci)/" allowed;
#
# Examples:
#   "MyOrgScraper/1.0"        allowed;
#   "~^JOSM/"                 allowed;
#   "~^(?:iD|Vespucci)/"      allowed;
#   "~badbot"                 deny;
