services:
  import:
    image: b1tw153/overpass-api:latest
    entrypoint:
      - /opt/overpass/bin/import_osm_data.sh
      - --diff-url=https://download.openstreetmap.fr/replication/europe/italy/minute
      - --data-source=https://download.openstreetmap.fr/extracts/europe/italy-latest.osm.pbf
      - --meta=yes
    environment:
      OVERPASS_DB_DIR: /opt/overpass/db
      EXTRACT_FILE_URL: https://download.openstreetmap.fr/extracts/europe/italy-latest.osm.pbf
      OVERPASS_DIFF_URL: https://download.openstreetmap.fr/replication/europe/italy/minute
      OVERPASS_UPDATE_FREQUENCY: 60
      OVERPASS_AREAS: yes
      OVERPASS_META_MODE: yes
      OVERPASS_REPLICATE_ID: auto
    volumes:
      - database:/opt/overpass/db
    restart: "no"

  api:
    image: b1tw153/overpass-api:latest
    environment:
      OVERPASS_DB_DIR: /opt/overpass/db
      EXTRACT_FILE_URL: https://download.openstreetmap.fr/extracts/europe/italy-latest.osm.pbf
      OVERPASS_DIFF_URL: https://download.openstreetmap.fr/replication/europe/italy/minute
      OVERPASS_UPDATE_FREQUENCY: 60
      OVERPASS_AREAS: yes
      OVERPASS_META_MODE: yes
      OVERPASS_REPLICATE_ID: auto
    ports:
      - "80:8080"
    volumes:
      - database:/opt/overpass/db

volumes:
  database:
