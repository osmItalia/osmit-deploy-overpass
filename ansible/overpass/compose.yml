services:
  import:
    image: b1tw153/overpass-api@sha256:b5b458688c20844630caea4b81f619545ddbc0a1f771ee42b82f3a1fff2a6188
    entrypoint:
      - /opt/overpass/bin/import_osm_data.sh
      - --diff-url=https://download.openstreetmap.fr/replication/europe/italy/minute
      - --data-source=https://download.openstreetmap.fr/extracts/europe/italy-latest.osm.pbf
      - --meta=yes
    environment:
      OVERPASS_DB_DIR: /opt/overpass/db
      EXTRACT_FILE_URL: https://download.openstreetmap.fr/extracts/europe/italy-latest.osm.pbf
      OVERPASS_DIFF_URL: https://download.openstreetmap.fr/replication/europe/italy/minute
      OVERPASS_UPDATE_FREQUENCY: 60
      OVERPASS_AREAS: yes
      OVERPASS_META_MODE: yes
      OVERPASS_REPLICATE_ID: auto
    volumes:
      - database:/opt/overpass/db
    restart: "no"

  api:
    build:
      context: ./
      args:
        # nginx files copied into the image, relative to this directory
        NGINX_TEMPLATE: nginx/nginx.conf.template
        NGINX_USER_AGENTS_DIR: nginx/user-agents
    environment:
      OVERPASS_DB_DIR: /opt/overpass/db
      EXTRACT_FILE_URL: https://download.openstreetmap.fr/extracts/europe/italy-latest.osm.pbf
      OVERPASS_DIFF_URL: https://download.openstreetmap.fr/replication/europe/italy/minute
      OVERPASS_UPDATE_FREQUENCY: 60
      OVERPASS_AREAS: yes
      OVERPASS_META_MODE: yes
      OVERPASS_REPLICATE_ID: auto
      NGINX_CLIENT_CONN_LIMIT: 30
    ports:
      - "80:8080"
    volumes:
      - database:/opt/overpass/db
      # Live-editable User-Agent whitelist, overrides the copy baked in the image.
      # Mounted as a directory (not a single file) so editors that replace the
      # file on save don't leave the container on a stale copy.
      # Apply changes with: docker compose exec api sh -c 'nginx -t && nginx -s reload'
      - ./nginx/user-agents:/etc/nginx/user-agents:ro

volumes:
  database:
